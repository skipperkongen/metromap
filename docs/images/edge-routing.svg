<text x="48" y="224" fill="#1d1d1f" font-size="13" text-anchor="start" font-weight="600">a</text>
<text x="312" y="45" fill="#1d1d1f" font-size="13" text-anchor="start" font-weight="600">b</text>
<text x="220" y="26" fill="#e5332a" font-size="12" text-anchor="middle">another station</text>
<text x="330" y="60" fill="#1d1d1f" font-size="12" text-anchor="start">a → b is 3 across, 2 up: not octilinear.</text>
<text x="330" y="80" fill="#1d1d1f" font-size="12" text-anchor="start">Two one-bend paths exist (dashed):</text>
<text x="330" y="98" fill="#1d1d1f" font-size="12" text-anchor="start">diagonal first, or straight first.</text>
<text x="330" y="124" fill="#00a651" font-size="12" text-anchor="start">The bend farther from other</text>
<text x="330" y="142" fill="#00a651" font-size="12" text-anchor="start">stations wins (solid).</text>
